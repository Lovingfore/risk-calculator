name: Collect Binance account equity

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/collect-balance.yml'
      - 'scripts/collect-balance.js'
      - 'scripts/collect-balance-loop.sh'
      - 'src/balance-history.js'
      - 'src/history-crypto.js'
  schedule:
    - cron: '3,8,13,18,23,28,33,38,43,48,53,58 * * * *'
  workflow_dispatch:
    inputs:
      continue_loop:
        description: 启动连续采集
        type: boolean
        required: false
        default: false
      collection_cycles:
        description: 每批采样次数（连续模式）
        type: number
        required: false
        default: 68

permissions:
  actions: write
  contents: write

concurrency:
  group: binance-balance-collector
  cancel-in-progress: false

jobs:
  collect:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Check out the default branch
        uses: actions/checkout@v4

      - name: Check required secrets
        id: secrets-check
        env:
          BINANCE_API_KEY: ${{ secrets.BINANCE_API_KEY }}
          BINANCE_API_SECRET: ${{ secrets.BINANCE_API_SECRET }}
          BALANCE_HISTORY_PASSWORD: ${{ secrets.BALANCE_HISTORY_PASSWORD }}
          CLASH_SUBSCRIPTION_URL: ${{ secrets.CLASH_SUBSCRIPTION_URL }}
        shell: bash
        run: |
          missing=0
          for name in BINANCE_API_KEY BINANCE_API_SECRET BALANCE_HISTORY_PASSWORD CLASH_SUBSCRIPTION_URL; do
            if [[ -z "${!name}" ]]; then
              echo "::notice title=余额采集未配置::请先在仓库 Actions Secrets 中设置 ${name}。"
              missing=1
            fi
          done
          if [[ "$missing" -eq 0 ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare encrypted data directory
        if: steps.secrets-check.outputs.ready == 'true'
        shell: bash
        run: mkdir -p "$RUNNER_TEMP/risk-calculator-balance"

      - name: Read existing encrypted history
        if: steps.secrets-check.outputs.ready == 'true'
        id: history-branch
        shell: bash
        run: |
          set +e
          git ls-remote --exit-code --heads origin refs/heads/balance-history >/dev/null
          result=$?
          set -e
          if [[ "$result" -eq 0 ]]; then
            git fetch --depth=1 origin refs/heads/balance-history
            git show FETCH_HEAD:history.jsonl > "$RUNNER_TEMP/risk-calculator-balance/history.jsonl"
            git show FETCH_HEAD:latest.json > "$RUNNER_TEMP/risk-calculator-balance/latest.json"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif [[ "$result" -eq 2 ]]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::无法检查余额历史分支。"
            exit "$result"
          fi

      - name: Set up Node.js 24
        if: steps.secrets-check.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Start the Japan proxy route
        if: steps.secrets-check.outputs.ready == 'true'
        env:
          CLASH_SUBSCRIPTION_URL: ${{ secrets.CLASH_SUBSCRIPTION_URL }}
        run: bash "$GITHUB_WORKSPACE/scripts/start-binance-proxy.sh"

      - name: Prepare collector files for the data branch
        if: steps.secrets-check.outputs.ready == 'true'
        shell: bash
        run: |
          collector_dir="$RUNNER_TEMP/risk-calculator-collector"
          mkdir -p "$collector_dir/scripts" "$collector_dir/src"
          cp "$GITHUB_WORKSPACE/scripts/collect-balance.js" "$collector_dir/scripts/"
          cp "$GITHUB_WORKSPACE/scripts/collect-balance-loop.sh" "$collector_dir/scripts/"
          cp "$GITHUB_WORKSPACE/src/balance-history.js" "$collector_dir/src/"
          cp "$GITHUB_WORKSPACE/src/history-crypto.js" "$collector_dir/src/"

      - name: Collect and publish account equity every five minutes
        if: steps.secrets-check.outputs.ready == 'true'
        env:
          BINANCE_API_KEY: ${{ secrets.BINANCE_API_KEY }}
          BINANCE_API_SECRET: ${{ secrets.BINANCE_API_SECRET }}
          BALANCE_HISTORY_PASSWORD: ${{ secrets.BALANCE_HISTORY_PASSWORD }}
          NODE_USE_ENV_PROXY: '1'
          HTTPS_PROXY: http://127.0.0.1:7890
          HTTP_PROXY: http://127.0.0.1:7890
          NO_PROXY: 127.0.0.1,localhost
          ACTIONS_DISPATCH_TOKEN: ${{ github.token }}
          HISTORY_BRANCH_EXISTS: ${{ steps.history-branch.outputs.exists }}
          CONTINUE_LOOP: ${{ inputs.continue_loop || false }}
          COLLECTION_CYCLES: ${{ inputs.collection_cycles || 68 }}
        run: bash "$RUNNER_TEMP/risk-calculator-collector/scripts/collect-balance-loop.sh"
